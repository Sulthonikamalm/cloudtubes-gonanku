<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ kode }} - Gonanku</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png', v='3') }}" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("gonanku-tema") || "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/komponen.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tema.css') }}" />
</head>
<body>
  <button type="button" class="tombol-ikon toggle-login" data-toggle-tema title="Ganti tema">☾</button>
  <div class="halaman-login">
    <div class="kartu-login" style="text-align: center;">
      <div class="kode-error" style="font-size: 56px; font-weight: 800; color: var(--navy-deep);">{{ kode }}</div>
      <p class="login-subjudul" style="margin-bottom: 20px;">{{ pesan }}</p>
      <a class="tombol tombol-utama tombol-blok" href="{{ url_for('dashboard.dashboard') }}">Kembali ke Dashboard</a>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
